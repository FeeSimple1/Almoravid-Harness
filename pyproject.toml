[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almoravid-harness"
version = "0.2.0"
description = "Python harness for GMT's Almoravid: Reconquista and Crusade in Spain, 1085-1086."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "FeeSimple1" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "hypothesis>=6",  # optional: enables tests/test_property_fuzz.py fuzz tests
]

[project.scripts]
almoravid = "almoravid.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/almoravid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
# src/ layout: make the package importable for a bare `python -m pytest`
# (no editable install / PYTHONPATH needed).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# N818: IllegalAction / EventNotResolvable are deliberate public exception
# names used across the harness and tests; not renamed to *Error.
ignore = ["N818"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option / typer.Argument in parameter defaults is the documented
# Typer pattern, not a B008 mutable-default hazard.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/almoravid"]

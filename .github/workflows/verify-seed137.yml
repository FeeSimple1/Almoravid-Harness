name: Verify seed-137 capability fixes
on:
  push:
    branches: ['maintenance/seed137-verify-20261010']
    paths: ['.github/workflows/verify-seed137.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 090f224444a281bae690641322448b83d427d68d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact tested patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          expected = '4d03177d1dcd7664aa3882ea09b113cba1ba80dd5b7cbf557e53b68e93731970'
          blobs = ['8863f05a1c0d1481017eeeabd03bb631b43885ad', '6fe920144cad2e1671738e45b0b311825a020b0b']
          parts = []
          for sha in blobs:
              url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}'
              request = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'User-Agent': 'almoravid-seed137-verification',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  obj = json.load(response)
              assert obj['sha'] == sha and obj['encoding'] == 'base64'
              parts.append(base64.b64decode(''.join(obj['content'].split()), validate=True))
          patch = lzma.decompress(b''.join(parts))
          assert len(patch) == 532404
          assert hashlib.sha256(patch).hexdigest() == expected
          path = Path(os.environ['RUNNER_TEMP']) / 'seed137.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--binary', '--full-index'])
          assert hashlib.sha256(staged).hexdigest() == expected
          print('Verified exact tested patch:', expected)
          PY
      - name: Install verification dependencies
        run: python -m pip install -e . pytest ruff
      - name: Ruff
        run: ruff check src/almoravid/ | tee "$RUNNER_TEMP/seed137-ruff.txt"
      - name: Full regression suite
        run: python -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/seed137-tests.xml" | tee "$RUNNER_TEMP/seed137-tests.txt"
      - name: Publish tested source branch
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          diff = subprocess.check_output(['git', 'diff', '--cached', '--binary', '--full-index'])
          assert hashlib.sha256(diff).hexdigest() == '4d03177d1dcd7664aa3882ea09b113cba1ba80dd5b7cbf557e53b68e93731970'
          PY
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix seed-137 capability scope, lifecycle, and player-selected discards'
          git rev-parse HEAD > "$RUNNER_TEMP/verified-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/verified-tree.txt"
          git push origin HEAD:refs/heads/fix/seed137-capabilities-20261010
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed137-fix-verification
          path: |
            ${{ runner.temp }}/seed137-tests.txt
            ${{ runner.temp }}/seed137-tests.xml
            ${{ runner.temp }}/seed137-ruff.txt
            ${{ runner.temp }}/verified-commit.txt
            ${{ runner.temp }}/verified-tree.txt
          retention-days: 7

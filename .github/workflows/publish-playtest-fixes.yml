name: Verify and publish playtest fixes
on:
  push:
    branches: ['maintenance/almoravid-fix-publish-20261010']
    paths: ['.github/workflows/publish-playtest-fixes.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9131a76d12dbbdde8838e06ae7a8412e6cbae546
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact locally verified patch
        env:
          PATCH_B64: >-
            
            
            
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(os.environ['PATCH_B64'].split())
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a5d329a1bdfac586eb5998f5d576a59c158f46af4a68d5cd0b06cfdc4448152e'
          Path('/tmp/almoravid-fixes.patch').write_bytes(patch)
          PY
          git apply --check /tmp/almoravid-fixes.patch
          git apply --index /tmp/almoravid-fixes.patch
          test "$(git write-tree)" = "1f4b6828dcf5f59587905f7aa6f9b36ca6f22b2f"
          git diff --cached --check
      - name: Install verification dependencies
        run: |
          pip install -e .
          pip install pytest ruff
      - name: Lint
        run: ruff check src/almoravid/
      - name: Full regression suite
        run: pytest -q --junitxml=/tmp/almoravid-tests.xml | tee /tmp/almoravid-tests.txt
      - name: Publish tested source branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix six independently reproduced Almoravid playtest defects'
          git push origin HEAD:refs/heads/fix/almoravid-playtest-2026-10-10
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: almoravid-fix-verification
          path: |
            /tmp/almoravid-tests.xml
            /tmp/almoravid-tests.txt
          retention-days: 7

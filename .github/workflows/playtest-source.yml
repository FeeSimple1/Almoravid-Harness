name: Playtest source snapshot
on:
  push:
    branches: ['playtest/2026-10-10-session']
    paths: ['.github/workflows/playtest-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9131a76d12dbbdde8838e06ae7a8412e6cbae546
          persist-credentials: false
      - name: Package the exact main source for local playtesting
        run: |
          git archive --format=tar.gz --output=almoravid-source.tar.gz HEAD
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: almoravid-source-9131a76
          path: |
            almoravid-source.tar.gz
            source-commit.txt
          retention-days: 3
